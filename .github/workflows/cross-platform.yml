name: Cross-platform

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # 真实浏览器的端到端测试(tests/test_e2e_browser.py)需要图形环境,
      # 这里不设 AUTOVISOR_E2E, 由测试自己跳过
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

  linux-launcher:
    name: launcher (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Prepare config
        run: cp config.linux.ini.example config.linux.ini

      - name: First run deploys the environment
        run: |
          out=$(bash ./run.sh --help)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "usage: Autovisor.py"
          test -f .autovisor/env.ready
          test "$(stat -c '%a' config.linux.ini)" = "600"

      - name: Second run reuses ready environment
        run: |
          out=$(bash ./run.sh --help)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "环境已就绪"
